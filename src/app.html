<div class="stack prose">
  <h2>使い方</h2>
  <ol>
    <li><b>ホーム</b>の上で教材（①竹取物語／②電車は走る／総合）を選び、モードを選ぶ。記録は教材ごとに別々に数えます。迷ったら <b>A：Sランク集中</b> → <b>B：語句の意味</b> → <b>E：模擬試験</b> の順に。</li>
    <li>選択問題は答えを押してから<b>「解答する」</b>。書く問題は書いてから「解答する」。答えは解答するまで見えません。</li>
    <li>書く問題はキーワードで自動チェックしたあと、<b>模範解答と見くらべて ○／× を自分で押す</b>（意味が合っていれば○でOK）。</li>
    <li>×の問題は数問あとにもう一度出ます。正解が続くと「習得」になり、翌日・3日後…と間をあけて出ます（試験までに必ず一回は戻ってきます）。</li>
    <li><b>傍線部</b>タブ：本文の傍線（①②…）をタップするとその傍線の問題に飛びます。問題の答え合わせのあと「本文で前後を確認する」で本文に戻れます。</li>
    <li><b>模擬試験</b>：学校のテストと同じ「漢字→語句→傍線部(A)(B)…→記述→原稿用紙」の順。最後に「採点する」。記述は点数ボタンで自己採点。</li>
    <li><b>記録</b>タブ：記録のバックアップ（コピーして保存）・復元・CSV。記録はこの端末のブラウザだけに保存されます。</li>
    <li>本文の「縦書き」ボタンで、教科書と同じ縦書き表示に切りかえられます。</li>
  </ol>
  <h2>過去問（一学期期末）から分かった出題の形</h2>
  <div class="tbl"><table>
    <thead><tr><th>設問</th><th>大問一（説明文）</th><th>大問二（随筆・物語）</th><th>この対策での扱い</th></tr></thead>
    <tbody>
      <tr><td>問1 漢字</td><td>a〜j 10問（読み・書き）</td><td>a〜j 10問</td><td>読み37・書き20問</td></tr>
      <tr><td>問2 語句の意味</td><td>ⅰ〜ⅳ（3択）</td><td>ⅰ〜ⅳ（3択）</td><td>60語（4択）＋短答</td></tr>
      <tr><td>傍線部の読解</td><td>(A)〜(H)</td><td>(A)〜(I)</td><td>傍線つき本文15か所</td></tr>
      <tr><td>気持ちの選択</td><td>—</td><td>「どのような気持ちが伝わるか」4択</td><td>心情40問</td></tr>
      <tr><td>抜き出し</td><td>段落の初め7字</td><td>初めと終わりの5字・2つ書き抜き</td><td>抜き出し21問</td></tr>
      <tr><td>指示語</td><td>—</td><td>「これくらい」の指す内容</td><td>指示語・表現21問</td></tr>
      <tr><td>記述</td><td>10〜20字／50〜75字（台詞形式）</td><td>20字程度／20字以内の台詞／50字以上</td><td>記述20問</td></tr>
      <tr><td>大問三</td><td colspan="2">原稿用紙の使い方のまちがい探し</td><td>原稿用紙6問</td></tr>
    </tbody></table></div>
  <p class="small">先生の特徴：傍線部は「気持ちが表れた行動・表現」「かぎかっこの効果」「伝聞表現」など表現そのものに引かれる。気持ちの選択肢は「本文の一部を使ったひっかけ」（人物や時期を入れかえる）が多い。記述は「本文の言葉を用いて」「台詞の形で」など条件つき。</p>
  <h2>「電車は走る」で特に大事なところ</h2>
  <ul>
    <li><b>行動描写→心情</b>：カズオ「眠ったふりをする」（学びの道しるべ②・253ページ上9行め）、タケシ「唇をかみしめたまま、本を読み始めた」、ヒナコ「うつむいた」、サユリ「つり革を強く握りしめる」。</li>
    <li><b>語り手と視点人物</b>：語り手は物語の外にいて、視点人物は4人。お姉さんの様子はサユリの目から見たもの。最後に語り手が「僕たち」として出てきて、読者に「あなたの『正しさ』はどこにある？」と問いかける。</li>
    <li><b>くり返し</b>：「〜は電車の中にいる。」「電車は走る。」「……はずだ。」</li>
    <li><b>主題</b>：「正しさ」は人の数だけあり、他の人の正しさや「常識（みんなの正しさ）」と一致しないこともある。</li>
  </ul>
  <h2>「竹取物語」で特に大事なところ</h2>
  <ul>
    <li><b>新出漢字11字</b>（筒・嘆・遣・髪・錠・伴・託・献・尋・吐・煙）は「I：漢字 完全習得」で全問正解までくり返せます。</li>
    <li><b>語句37語</b>は配られた暗記テストの「短い意味」を正解にしています。「J：語句 全問正解まで」「K：間違えた語句だけ」で仕上げ。</li>
    <li><b>古文4か所</b>（119・123・125・126ページ）：歴史的仮名遣い（いふ→いう、ゐたり→いたり、うつくしう→うつくしゅう、やう→よう、たまへ→たまえ、かひなし→かいなし など）と、教科書下段の現代語訳。</li>
    <li><b>古語と現代語で意味が違う語</b>（131ページ）：うつくし＝かわいらしい、いとほし＝気の毒だ、かなし＝かわいそうだ、おどろく＝はっと目が覚める。</li>
    <li><b>心情の変化</b>：羽衣を着る前（翁や帝を思って悲しむ）→着たあと（「いとほし、かなし」と思う心も消え、物思いがなくなる）。</li>
    <li><b>結末</b>：帝は不死の薬を天に近い駿河の国の山で燃やさせた。「士に富む山」「不死の山」→富士の山。煙は今も立ち上る。</li>
    <li>学びの道しるべ③「最も悲しんだのは誰か」は記述で出やすい問いです。</li>
  </ul>
  <p class="small">過去問（一学期期末）には古文がなかったため、仮名遣い・現代語訳・主語・敬語の問題には「補強」と表示しています。</p>
  <h2>ランクのつけ方</h2>
  <p class="small"><b>S</b>：過去問と同じ形式で、本文の中心となる場面・学びの道しるべ・図解例で扱われている箇所。<b>A</b>：理解に必要で、出ても不自然でない問題。<b>B</b>：理解を深める応用。ランクは根拠にもとづく相対評価で、的中を約束するものではありません。</p>
  <h2>注意</h2>
  <p class="small">本文は学習に必要な部分だけを引用し、教科書のページを示しています。教科書本文で必ず確認してください。「※推し量る問題」は本文にはっきり書かれていないことを本文の言葉から考える問題です。</p>
